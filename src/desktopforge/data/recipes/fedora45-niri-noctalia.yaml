      "Existing Niri service drop-ins, shell bootstrap hooks and display-manager session wrappers must be reviewed for cross-session effects.",
      "NIRI_CONFIG and imported user-manager environment must not leak into a later login session; startup failure and logout cleanup remain untested.",
      "GDM and SDDM login, shell lifecycle, GPU behavior and preservation of existing sessions require disposable VM validation."
    ]
