<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DesktopForge VM-lab authorization probe. Disposable guest only. -->
<busconfig>
  <policy user="root">
    <allow own="org.desktopforge.LabAuthProbe1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.desktopforge.LabAuthProbe1"
           send_interface="org.desktopforge.LabAuthProbe1"
           send_member="Probe"/>
    <allow send_destination="org.desktopforge.LabAuthProbe1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
  </policy>
</busconfig>
