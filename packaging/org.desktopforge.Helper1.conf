<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DesktopForge privileged helper (production). Only root may own the name; anyone
     may ask for Info and previews; Apply is additionally authorized through Polkit. -->
<busconfig>
  <policy user="root">
    <allow own="org.desktopforge.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.desktopforge.Helper1" send_interface="org.desktopforge.Helper1" send_member="Info"/>
    <allow send_destination="org.desktopforge.Helper1" send_interface="org.desktopforge.Helper1" send_member="Preview"/>
    <allow send_destination="org.desktopforge.Helper1" send_interface="org.desktopforge.Helper1" send_member="Apply"/>
    <allow send_destination="org.desktopforge.Helper1" send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
  </policy>
</busconfig>
