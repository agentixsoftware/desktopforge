[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktopforge"
version = "0.1.0"
description = "Read-only Linux desktop environment inventory and planning foundation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "DesktopForge contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
desktopforge = "desktopforge.cli:main"
desktopforge-session = "desktopforge.session_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
desktopforge = ["data/recipes/*.yaml"]
