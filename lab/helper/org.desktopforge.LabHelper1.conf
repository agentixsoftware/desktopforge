<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DesktopForge VM-lab helper (synthetic recipes only). Disposable guest only. -->
<busconfig>
  <policy user="root">
    <allow own="org.desktopforge.LabHelper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.desktopforge.LabHelper1"
           send_interface="org.desktopforge.LabHelper1"
           send_member="Preview"/>
    <allow send_destination="org.desktopforge.LabHelper1"
           send_interface="org.desktopforge.LabHelper1"
           send_member="Apply"/>
    <allow send_destination="org.desktopforge.LabHelper1"
           send_interface="org.desktopforge.LabHelper1"
           send_member="Info"/>
    <allow send_destination="org.desktopforge.LabHelper1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
  </policy>
</busconfig>
